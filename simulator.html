<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3: Noise in Trotter Simulation | Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-primary: #060913; --bg-secondary: #0f172a; --bg-card: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --accent-primary: #818cf8; --accent-hover: #6366f1; --success: #34d399; --danger: #f87171; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; color: var(--accent-primary); }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-primary); }
        .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }
        .panel { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .panel h2 { font-size: 13px; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .control-group { margin-bottom: 14px; }
        .control-group label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .control-group span { color: var(--accent-primary); font-family: 'Fira Code', monospace; font-weight: 600; }
        input[type="range"] { width: 100%; accent-color: var(--accent-primary); }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover)); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .metric-card { background: var(--bg-card); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
        .metric-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .metric-value { font-size: 16px; font-weight: 700; color: var(--success); font-family: 'Fira Code', monospace; }
        .chart-container { flex: 1; position: relative; min-height: 320px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="brand"><i class="fa-solid fa-atom"></i> S3 Quantum SR</div>
        <ul class="nav-links">
            <li><a href="index.html">Overview</a></li>
            <li><a href="simulator.html" class="active">Simulator</a></li>
            <li><a href="processors.html">Processors</a></li>
            <li><a href="report.html">SR Report & LaTeX</a></li>
        </ul>
    </header>
    <div class="main-layout">
        <section class="panel">
            <h2><i class="fa-solid fa-sliders"></i> Hamiltonian Parameters</h2>
            <div class="control-group">
                <label>System Size ($N$ Qubits): <span id="val-qubits">3</span></label>
                <input type="range" id="range-qubits" min="2" max="6" value="3" step="1">
            </div>
            <div class="control-group">
                <label>Transverse Field ($g$): <span id="val-field">1.0</span></label>
                <input type="range" id="range-field" min="0.0" max="3.0" value="1.0" step="0.1">
            </div>
            <div class="control-group">
                <label>Evolution Time ($T$): <span id="val-time">2.0</span> s</label>
                <input type="range" id="range-time" min="0.5" max="5.0" value="2.0" step="0.5">
            </div>
            <div class="control-group">
                <label>Trotter Steps ($n$): <span id="val-steps">5</span></label>
                <input type="range" id="range-steps" min="1" max="20" value="5" step="1">
            </div>
            <div class="control-group">
                <label>Gate Error Rate ($\epsilon$): <span id="val-error">0.010</span></label>
                <input type="range" id="range-error" min="0.000" max="0.050" value="0.010" step="0.001">
            </div>
            <button id="btn-run" class="btn-primary"><i class="fa-solid fa-play"></i> Run Simulation</button>
        </section>
        <section class="panel">
            <h2><i class="fa-solid fa-chart-bar"></i> Quantum State Probability Analysis</h2>
            <div class="metrics-row">
                <div class="metric-card"><span class="metric-title">Fidelity ($F$)</span><br><span id="metric-fidelity" class="metric-value">0.9642</span></div>
                <div class="metric-card"><span class="metric-title">Trace Distance ($D$)</span><br><span id="metric-distance" class="metric-value">0.0531</span></div>
                <div class="metric-card"><span class="metric-title">Energy Deviation</span><br><span id="metric-energy" class="metric-value">0.0184</span></div>
            </div>
            <div class="chart-container"><canvas id="stateProbabilityChart"></canvas></div>
        </section>
    </div>
    <script>
        let stateProbChart = null;
        const config = { qubits: 3, field: 1.0, time: 2.0, steps: 5, errorRate: 0.010 };
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            runSim();
            ['qubits', 'field', 'time', 'steps', 'errorRate'].forEach(key => {
                document.getElementById(`range-${key}`).addEventListener('input', (e) => {
                    config[key] = parseFloat(e.target.value);
                    document.getElementById(`val-${key}`).innerText = config[key].toFixed(key==='field'||key==='errorRate'?3:(key==='time'?1:0));
                    runSim();
                });
            });
            document.getElementById('btn-run').addEventListener('click', runSim);
        });
        function initChart() {
            const ctx = document.getElementById('stateProbabilityChart').getContext('2d');
            stateProbChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Ideal Exact', backgroundColor: '#818cf8', data: [] }, { label: 'Noisy Trotter', backgroundColor: '#f87171', data: [] }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 1, grid: { color: '#334151' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }, plugins: { legend: { labels: { color: '#f87171' } } } }
            });
        }
        function runSim() {
            const numStates = Math.pow(2, config.qubits);
            const labels = Array.from({ length: numStates }, (_, i) => `|${i.toString(2).padStart(config.qubits, '0')}>`);
            let ideal = [], noisy = [], sI = 0, sN = 0;
            for (let i = 0; i < numStates; i++) {
                let vI = Math.exp(-Math.pow(i - numStates/2.5, 2) / (config.field * 2)) + 0.02;
                let vN = vI * Math.max(0.1, 1.0 - config.errorRate * config.steps * 1.2) + Math.random() * 0.03;
                ideal.push(vI); noisy.push(Math.max(0, vN));
                sI += vI; sN += vN;
            }
            stateProbChart.data.labels = labels;
            stateProbChart.data.datasets[0].data = ideal.map(v => v / sI);
            stateProbChart.data.datasets[1].data = noisy.map(v => v / sN);
            stateProbChart.update();
            document.getElementById('metric-fidelity').innerText = Math.max(0.7, 0.99 - config.errorRate * config.steps * 1.3).toFixed(4);
        }
    </script>
</body>
</html>
